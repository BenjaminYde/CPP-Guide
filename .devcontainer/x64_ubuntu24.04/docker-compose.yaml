services:
  devcontainer:
    stdin_open: true
    tty: true
    build:
      context: ../..
      dockerfile: .devcontainer/x64_ubuntu24.04/Dockerfile
    user: developer
    volumes:
      # workspace
      - ../..:/home/developer/CPP-Guide
      # host related
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev:rw
    environment:
      # host related
      - DISPLAY=$DISPLAY
      - XAUTHORITY=$XAUTHORITY
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    network_mode: host